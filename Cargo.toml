[package]
name = "gaudip"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/rope",
    "crates/intervals",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
bitflags = "2.10.0"
delegate = "0.13.5"
rand = "0.9.2"
rand_chacha = "0.9.0"
slab = "0.4.11"
smallvec = "1.15.1"
str_indices = "0.4.4"

roperig = { path = "crates/rope" }
intervals = { path = "crates/intervals" }

[dependencies]
glib = "0.21"
gtk = { version = "0.10.1", package = "gtk4", features = ["v4_14"] }

async-channel = "2.5.0"
env_logger = "0.11.8"
log = "0.4"
slab = { workspace = true }
str_indices = { workspace = true }
tokio = { version = "1", features = ["full"] }

roperig = { workspace = true }

[profile.dev]
split-debuginfo = "unpacked"

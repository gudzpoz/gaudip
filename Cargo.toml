[package]
name = "gaudip"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/rope",
    "crates/intervals",
    "crates/disp-ipc",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
bitflags = "2.10.0"
delegate = "0.13.5"
dirs = "6.0.0"
env_logger = "0.11.8"
flatbuffers = "25.9.23"
interprocess = "2.2.3"
log = "0.4"
object-pool = "0.6.0"
rand = "0.9.2"
rand_chacha = "0.9.0"
slab = "0.4.11"
smallvec = "1.15.1"
str_indices = "0.4.4"
tokio = "1"

roperig = { path = "crates/rope" }
intervals = { path = "crates/intervals" }
disp-ipc = { path = "crates/disp-ipc" }

[dependencies]
glib = "0.21"
gtk = { version = "0.10.1", package = "gtk4", features = ["v4_14"] }

async-channel = "2.5.0"
env_logger = { workspace = true }
flatbuffers = { workspace = true }
log = { workspace = true }
slab = { workspace = true }
str_indices = { workspace = true }
tokio = { workspace = true, features = ["full"] }

roperig = { workspace = true }

[profile.dev]
split-debuginfo = "unpacked"
